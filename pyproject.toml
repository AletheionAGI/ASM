[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheion-state-models"
version = "0.2.0"
description = "Experimental attention-free causal state-model family derived from DRM research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Felipe Maya Muniz", email = "contact@aletheionagi.com" }]
dependencies = [
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]
yaml = ["pyyaml>=6.0"]
viz = ["matplotlib>=3.11"]
docs = ["sphinx>=7.0", "myst-parser>=2.0"]
hf = ["transformers>=4.40", "datasets>=2.18"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["aletheion_state_models*", "drm_language_emitter*", "world_model*", "transformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
